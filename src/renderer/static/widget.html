<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Postura – widget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="widget-body">
    <div class="widget" id="widget" data-state="absent" title="Postura">
      <button class="w-open" id="w-open" type="button" aria-label="Otwórz Posturę">
        <span class="w-dot" aria-hidden="true"></span>
        <span class="w-score" id="w-score">–</span>
      </button>
      <span class="w-more" id="w-more"></span>
    </div>
    <script type="module" src="widget.js"></script>
  </body>
</html>
